<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
.arte{background:radial-gradient(circle at 50% 60%,#fff 0,var(--fundo) 60%)}
.canto1{position:absolute;left:-180px;top:-180px;width:420px;height:420px;border-radius:50%;background:var(--tomate)}
.canto1:after{content:"";position:absolute;inset:150px -60px -60px 150px;border-radius:50%;background:var(--amarelo);z-index:-1}
.canto2{position:absolute;right:-300px;bottom:-300px;width:480px;height:480px;border-radius:50%;background:var(--amarelo)}
.topo{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:800 132px/.95 'Bricolage Grotesque',sans-serif;letter-spacing:-5px;margin-top:40px}
h1 span{display:block;color:var(--tomate);font-size:112px;letter-spacing:-4px}
.risco{width:600px;height:26px;margin-top:22px}
.cta{position:absolute;left:50%;transform:translateX(-50%);background:var(--zap);color:#fff;border-radius:999px;padding:30px 64px;font:800 42px/1 Inter;display:flex;align-items:center;gap:18px;box-shadow:0 18px 40px rgba(31,174,85,.35);white-space:nowrap;z-index:5}
.info{position:absolute;left:0;right:0;text-align:center;font:700 30px/1.3 Inter;color:var(--cinza)}
.info b{color:var(--tinta)}
/* feed */
.feed .topo{top:70px}.feed h1{font-size:108px}.feed h1 span{font-size:92px}.feed .risco{width:520px}
.feed .note{left:250px;top:650px;transform:scale(.56);transform-origin:0 0}
.feed .cel{left:80px;top:590px;transform:rotate(-6deg) scale(.6);transform-origin:0 0}
.feed .cta{bottom:120px;padding:24px 52px;font-size:36px}
.feed .info{bottom:52px;font-size:26px}
/* story */
.story .topo{top:200px}.story h1 span{font-size:98px;padding:0 40px}
.story .note{left:250px;top:870px;transform:scale(.58);transform-origin:0 0}
.story .cel{left:70px;top:800px;transform:rotate(-6deg) scale(.66);transform-origin:0 0}
.story .cta{bottom:300px}
.story .info{bottom:210px}
</style></head><body>
<div class="arte">
  <div class="canto1"></div><div class="canto2"></div>
  <div class="topo">
    <div class="marca"><img src="icone.svg" alt="">Pedido <b>Já</b></div>
    <h1>Cardápio digital<span>para delivery, mesas e balcão.</span></h1>
    <svg class="risco" viewBox="0 0 600 26"><path d="M8 18C150 4 450 4 592 16" stroke="#e63b2e" stroke-width="10" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="note"><div class="tampa"><div class="tela"><iframe src="https://hamburgueriamadeira.pedidoja.com/"></iframe></div></div><div class="base"></div></div>
  <div class="cel"><div class="ilha"></div><div class="tela"><iframe src="https://hamburgueriamadeira.pedidoja.com/"></iframe></div></div>
  <div class="cta">Peça uma demonstração <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></div>
  <p class="info"><b>R$ 10 por dia</b> · sem comissão por pedido · pedidoja.com</p>
</div>
<script>document.body.className=location.hash.slice(1)||'feed'</script>
</body></html>
